<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vdc-cluster console</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%231a73e8' d='M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z'/%3E%3C/svg%3E">
<!--
  vdc-portal: a web console for the cloud API of vdc-cluster (the kit's cloud/ folder). One file,
  no build step and no external assets (the lab network may have no internet). portal.py serves
  it and passes the API calls on to the kit's API, so the page and the API share one origin and
  the kit needs no change. It uses only the API's existing endpoints, as the kit has them.
  What the page shows follows the role in the token: consumer (a tenant), provider, auditor.
-->
<style>
:root{
  --blue:#1a73e8; --blue-d:#1967d2; --blue-l:#e8f0fe; --text:#202124; --text2:#5f6368; --line:#dadce0;
  --line2:#e8eaed; --bg2:#f8f9fa; --ok:#188038; --ok-l:#e6f4ea; --err:#d93025; --err-l:#fce8e6;
  --warn:#e37400; --warn-l:#fef7e0; --off:#80868b; --r:8px;
  --font:"Google Sans",Roboto,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:14px/1.45 var(--font);color:var(--text);background:#fff}
a{color:var(--blue-d);text-decoration:none} a:hover{text-decoration:underline}
code,pre,.mono{font-family:var(--mono);font-size:12.5px}
svg.i{width:20px;height:20px;fill:currentColor;flex:none;vertical-align:middle}
h1{font-size:22px;font-weight:400;margin:0}
h2{font-size:16px;font-weight:500;margin:0 0 12px}
h3{font-size:14px;font-weight:500;margin:0 0 8px}
.muted{color:var(--text2)} .small{font-size:12px} .nowrap{white-space:nowrap} .right{text-align:right}
.hidden{display:none!important}

/* ---------------------------------------------------------------- shell */
#top{position:fixed;inset:0 0 auto 0;height:48px;background:var(--blue);color:#fff;display:flex;align-items:center;
  gap:8px;padding:0 8px;z-index:20;box-shadow:0 1px 2px rgba(0,0,0,.2)}
#top .brand{display:flex;align-items:center;gap:8px;font-size:18px;color:#fff;margin-right:8px}
#top .brand b{font-weight:500} #top .brand span{opacity:.85}
.ctx{display:flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.5);border-radius:4px;padding:4px 10px;
  font-size:13px;color:#fff;background:rgba(255,255,255,.08);cursor:default;white-space:nowrap}
#search{flex:1;max-width:620px;margin:0 auto;position:relative}
#search input{width:100%;height:34px;border:0;border-radius:4px;padding:0 12px 0 38px;background:rgba(255,255,255,.18);
  color:#fff;font:inherit;outline:none} #search input::placeholder{color:rgba(255,255,255,.8)}
#search input:focus{background:#fff;color:var(--text)} #search input:focus::placeholder{color:var(--text2)}
#search svg{position:absolute;left:10px;top:7px;fill:#fff} #search input:focus+svg{fill:var(--text2)}
#searchres{position:absolute;top:38px;left:0;right:0;background:#fff;color:var(--text);border-radius:4px;
  box-shadow:0 2px 10px rgba(0,0,0,.25);max-height:360px;overflow:auto}
#searchres a{display:block;padding:8px 14px;color:var(--text)} #searchres a:hover,#searchres a.sel{background:var(--blue-l);text-decoration:none}
.tbtn{background:none;border:0;color:inherit;width:40px;height:40px;border-radius:50%;display:inline-flex;
  align-items:center;justify-content:center;cursor:pointer;position:relative}
.tbtn:hover{background:rgba(255,255,255,.15)}
.avatar{width:32px;height:32px;border-radius:50%;background:#fff;color:var(--blue-d);display:flex;align-items:center;
  justify-content:center;font-weight:500;font-size:15px}
.badge{position:absolute;top:4px;right:4px;background:#fbbc04;color:#202124;border-radius:8px;font-size:10px;
  min-width:16px;height:16px;line-height:16px;padding:0 4px;font-weight:600}
.menu{position:fixed;top:52px;right:8px;background:#fff;color:var(--text);border-radius:8px;min-width:260px;max-width:380px;
  box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:30;padding:8px 0;max-height:70vh;overflow:auto}
.menu .mi{display:flex;gap:12px;align-items:center;padding:9px 16px;cursor:pointer;color:var(--text)}
.menu .mi:hover{background:var(--bg2);text-decoration:none}
.menu .mh{padding:8px 16px 10px;border-bottom:1px solid var(--line2);margin-bottom:6px}
#side{position:fixed;top:48px;bottom:0;left:0;width:248px;border-right:1px solid var(--line);background:#fff;
  overflow-y:auto;padding:8px 0 24px;z-index:10;transition:transform .15s}
body.navoff #side{transform:translateX(-100%)} body.navoff #main{margin-left:0}
#side .grp{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:var(--text2);padding:16px 24px 6px;font-weight:500}
#side a{display:flex;align-items:center;gap:16px;height:36px;padding:0 24px;color:var(--text);border-radius:0 18px 18px 0;margin-right:10px}
#side a svg{fill:var(--text2)} #side a:hover{background:var(--bg2);text-decoration:none}
#side a.on{background:var(--blue-l);color:var(--blue-d);font-weight:500} #side a.on svg{fill:var(--blue-d)}
#main{margin:48px 0 0 248px;padding:20px 32px 60px;min-height:calc(100vh - 48px);transition:margin .15s}
@media(max-width:900px){#main{margin-left:0;padding:16px} #side{transform:translateX(-100%);box-shadow:2px 0 10px rgba(0,0,0,.2)}
  body.navon #side{transform:none} .ctx{display:none}}

/* ---------------------------------------------------------------- page parts */
.phead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:44px;margin-bottom:16px;border-bottom:1px solid var(--line2);padding-bottom:10px}
.phead h1{margin-right:20px}
.crumb{font-size:13px;color:var(--text2);margin-bottom:2px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:4px;border:1px solid var(--line);
  background:#fff;color:var(--blue-d);font:500 14px var(--font);cursor:pointer;white-space:nowrap}
.btn:hover{background:#f6fafe;text-decoration:none} .btn svg{fill:currentColor;width:18px;height:18px}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff} .btn.pri:hover{background:var(--blue-d)}
.btn.flat{border-color:transparent;background:none} .btn.flat:hover{background:var(--blue-l)}
.btn.danger{color:var(--err)} .btn.danger.pri{background:var(--err);border-color:var(--err);color:#fff}
.btn[disabled]{opacity:.45;cursor:default;pointer-events:none}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.ibtn{border:0;background:none;width:32px;height:32px;border-radius:50%;cursor:pointer;color:var(--text2);display:inline-flex;align-items:center;justify-content:center}
.ibtn:hover{background:var(--line2);color:var(--text)} .ibtn svg{width:18px;height:18px}
.ibtn[disabled]{opacity:.3;pointer-events:none}
.card{border:1px solid var(--line);border-radius:var(--r);background:#fff;padding:16px 20px;margin-bottom:16px}
.card.p0{padding:0} .card>.ch{display:flex;align-items:center;gap:8px;padding:14px 20px;border-bottom:1px solid var(--line2)}
.card>.ch h2{margin:0;flex:1}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));align-items:start}
.grid .card{margin:0}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media(max-width:1100px){.cols{grid-template-columns:1fr}}
.stat{font-size:28px;font-weight:400;line-height:1.2} .stat small{font-size:14px;color:var(--text2);margin-left:4px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 16px;margin:0}
.kv dt{color:var(--text2)} .kv dd{margin:0;word-break:break-word}
.bar{height:6px;background:var(--line2);border-radius:3px;overflow:hidden;margin:4px 0 10px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:3px}
.bar i.hi{background:var(--warn)} .bar i.full{background:var(--err)}
.qrow{display:flex;justify-content:space-between;font-size:13px}
.note{background:var(--blue-l);border-radius:6px;padding:10px 14px;margin:0 0 16px;display:flex;gap:10px;align-items:flex-start;font-size:13px}
.note.warn{background:var(--warn-l)} .note.err{background:var(--err-l)}
.note svg{flex:none;fill:var(--blue-d);width:18px;height:18px} .note.warn svg{fill:var(--warn)} .note.err svg{fill:var(--err)}
pre.code{background:var(--bg2);border:1px solid var(--line2);border-radius:6px;padding:12px 14px;overflow:auto;margin:0;max-height:480px;white-space:pre}
.copyline{display:flex;align-items:center;gap:4px;background:var(--bg2);border-radius:4px;padding:2px 2px 2px 10px;max-width:100%}
.copyline code{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

/* ---------------------------------------------------------------- tables */
.tbar{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line2);flex-wrap:wrap}
.filter{display:flex;align-items:center;gap:6px;flex:1;min-width:200px;color:var(--text2)}
.filter input{border:0;outline:none;font:inherit;flex:1;padding:6px 0}
table.t{width:100%;border-collapse:collapse}
table.t th{text-align:left;font-weight:500;font-size:12px;color:var(--text2);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:#fff}
table.t td{padding:8px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:hover td{background:var(--bg2)} table.t tr:last-child td{border-bottom:0}
table.t td.act{white-space:nowrap;text-align:right;width:1%}
table.t tfoot td{font-weight:500;border-top:1px solid var(--line);background:#fff}
.tscroll{overflow-x:auto}
.empty{padding:32px;text-align:center;color:var(--text2)}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--off);flex:none}
.st.ok::before{background:var(--ok)} .st.err::before{background:var(--err)} .st.warn::before{background:var(--warn)}
.st.busy::before{background:none;border:2px solid var(--blue);border-right-color:transparent;width:8px;height:8px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;background:var(--line2);color:var(--text2);white-space:nowrap}
.pill.ok{background:var(--ok-l);color:var(--ok)} .pill.err{background:var(--err-l);color:var(--err)}
.pill.warn{background:var(--warn-l);color:var(--warn)} .pill.blue{background:var(--blue-l);color:var(--blue-d)}

/* ---------------------------------------------------------------- forms */
.f{margin-bottom:16px} .f label,.flabel{display:block;font-size:12px;color:var(--text2);margin-bottom:4px;font-weight:500}
.f input[type=text],.f input[type=password],.f input[type=number],.f input[type=date],.f input[type=datetime-local],.f select,.f textarea,
.inp{width:100%;height:38px;border:1px solid var(--line);border-radius:4px;padding:0 12px;font:inherit;color:var(--text);background:#fff;outline:none}
.f textarea{height:auto;min-height:90px;padding:8px 12px;font-family:var(--mono);font-size:12.5px}
.f input:focus,.f select:focus,.f textarea:focus,.inp:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
.f .hint{font-size:12px;color:var(--text2);margin-top:4px}
.f.row{display:flex;gap:12px} .f.row>div{flex:1}
.chk{display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:12px} .chk input{width:16px;height:16px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.opt{border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;position:relative;display:block}
.opt:hover{border-color:var(--blue)} .opt input{position:absolute;opacity:0}
.opt:has(input:checked){border-color:var(--blue);box-shadow:0 0 0 1px var(--blue);background:#f6fafe}
.opt.dis{opacity:.45;cursor:not-allowed} .opt b{display:block;font-weight:500;margin-bottom:2px}
.opt .why{color:var(--err);font-size:11.5px}
.sticky{position:sticky;top:64px}
details.eq summary{cursor:pointer;color:var(--blue-d);font-weight:500;margin:4px 0 8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{border:0;background:#fff;padding:7px 14px;font:inherit;cursor:pointer;color:var(--text2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0} .seg button.on{background:var(--blue-l);color:var(--blue-d);font-weight:500}

/* ---------------------------------------------------------------- modal, toast, login */
#modal{position:fixed;inset:0;background:rgba(32,33,36,.55);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto}
#modal .dlg{background:#fff;border-radius:8px;width:560px;max-width:100%;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#modal .dlg.wide{width:820px}
#modal .dh{padding:20px 24px 4px;font-size:18px}
#modal .db{padding:12px 24px}
#modal .df{padding:8px 16px 16px;display:flex;justify-content:flex-end;gap:8px}
#modal .merr{color:var(--err);background:var(--err-l);border-radius:4px;padding:8px 12px;margin-bottom:12px;font-size:13px}
#toasts{position:fixed;left:24px;bottom:24px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:#323232;color:#fff;border-radius:4px;padding:12px 16px;min-width:280px;max-width:520px;box-shadow:0 3px 10px rgba(0,0,0,.3);
  display:flex;gap:12px;align-items:center;animation:up .2s}
.toast.err{background:#a50e0e}
@keyframes up{from{transform:translateY(20px);opacity:0}}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg2);padding:20px}
#login .box{background:#fff;border:1px solid var(--line);border-radius:8px;width:420px;padding:40px 40px 32px}
#login .logo{display:flex;align-items:center;gap:10px;font-size:22px;margin-bottom:6px} #login .logo svg{fill:var(--blue);width:36px;height:36px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid var(--blue);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite;vertical-align:middle}
.loading{padding:40px;color:var(--text2);display:flex;gap:12px;align-items:center}

/* ---------------------------------------------------------------- charts, invoice */
.chart svg{width:100%;height:auto;display:block}
.chart .lbl{font-size:10px;fill:var(--text2)} .chart rect.b{fill:var(--blue)} .chart rect.b:hover{fill:var(--blue-d)}
.hbar{display:grid;grid-template-columns:140px 1fr 90px;gap:10px;align-items:center;margin:6px 0;font-size:13px}
.hbar .track{height:14px;background:var(--line2);border-radius:3px;overflow:hidden} .hbar .track i{display:block;height:100%;background:var(--blue)}
.invoice{max-width:820px;border:1px solid var(--line);border-radius:8px;padding:40px 48px;background:#fff}
.invoice table.t td,.invoice table.t th{padding:8px 6px}
.invoice .ih{display:flex;justify-content:space-between;gap:20px;margin-bottom:28px}
@media print{
  #top,#side,.phead,.noprint,#toasts{display:none!important} #main{margin:0;padding:0} .invoice{border:0;padding:0;max-width:none}
}
</style>
</head>
<body>
<div id="login" class="hidden"></div>
<div id="app" class="hidden">
  <header id="top">
    <button class="tbtn" data-act="nav-toggle" title="Menu"><svg class="i" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
    <a class="brand" href="#/"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/></svg><b>vdc-cluster</b><span>console</span></a>
    <div class="ctx" id="ctx"></div>
    <div id="search"><input id="q" placeholder="Search pages, VMs, tenants (/)" autocomplete="off"><svg class="i" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><div id="searchres" class="hidden"></div></div>
    <button class="tbtn" data-act="jobs-menu" title="Activity"><svg class="i" viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg><span class="badge hidden" id="jobbadge"></span></button>
    <a class="tbtn" id="docslink" href="/docs" target="_blank" title="API documentation (Swagger)" style="color:#fff"><svg class="i" viewBox="0 0 24 24"><path d="M11 18h2v-2h-2v2zm1-16C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm0-14c-2.21 0-4 1.79-4 4h2c0-1.1.9-2 2-2s2 .9 2 2c0 2-3 1.75-3 5h2c0-2.25 3-2.5 3-5 0-2.21-1.79-4-4-4z"/></svg></a>
    <button class="tbtn" data-act="user-menu" title="Account"><span class="avatar" id="avatar"></span></button>
  </header>
  <nav id="side"></nav>
  <main id="main"></main>
</div>
<div id="menu" class="menu hidden"></div>
<div id="modal" class="hidden"></div>
<div id="toasts"></div>

<script>

/* ================================================================= icons */

  return html`<div class="qrow"><span>${label}</span><span class="muted">${fmt(used)} / ${fmt(max)}</span></div>
    <div class="bar"><i class="${p >= 100 ? "full" : p >= 80 ? "hi" : ""}" style="width:${p.toFixed(1)}%"></i></div>`;
}
// the kit's edge quota (19 Nov 2026 on): shown when the kit reports it
const edgeQuota = (u, q) => q.max_ports === undefined ? "" : html`${quotaBar("Floating IPs", u.floating_ips, q.max_floating_ips)}${quotaBar("Campus ports", u.ports, q.max_ports)}${quotaBar("Extra addresses", u.ips, q.max_ips)}`;
function errorBox(msg) { return note(html`<b>Could not load this part.</b> ${msg}`, "err"); }

// bar chart of a cost series (svg): {step: 1 day or 7, points: [{d: Date, v}]}
function costChart(series) {
  const xs = series.points.map(p => ({...p, k: (series.step > 1 ? "week of " : "") + p.d.toISOString().slice(0, 10)}));
  if (!xs.length) return html`<div class="muted">No data.</div>`;
  const W = 760, H = 200, L = 52, B = 22, top = 10, max = Math.max(...xs.map(x => x.v), 0.0001);
  const bw = (W - L - 8) / xs.length, y = v => H - B - (v / max) * (H - B - top);
  const ticks = [0, max / 2, max];
  return html`<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cost per ${series.step > 1 ? "week" : "day"}">
    ${ticks.map(t => raw(`<line x1="${L}" x2="${W}" y1="${y(t)}" y2="${y(t)}" stroke="#e8eaed"/><text class="lbl" x="${L - 6}" y="${y(t) + 3}" text-anchor="end">${esc(money(t, max < 1 ? 3 : 2))}</text>`))}
    ${xs.map((x, i) => raw(`<rect class="b" x="${L + i * bw + 1}" y="${y(x.v)}" width="${Math.max(1, bw - 2)}" height="${Math.max(0, H - B - y(x.v))}" rx="2"><title>${x.k}: ${esc(money(x.v, 4))}</title></rect>`))}
    ${xs.map((x, i) => ((xs.length - 1 - i) % Math.ceil(xs.length / 8) === 0) ? raw(`<text class="lbl" x="${L + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle">${x.d.getUTCDate()} ${x.d.toLocaleString(undefined, {month: "short", timeZone: "UTC"})}</text>`) : "")}
  </svg></div>`;
}
function hbars(items, fmt = money) {          // items = [{label, v, href?}]
  const max = Math.max(...items.map(i => i.v), 0.0001);
  if (!items.length) return html`<div class="muted">No usage in this period.</div>`;
  return html`${items.map(i => html`<div class="hbar"><span class="nowrap" style="overflow:hidden;text-overflow:ellipsis">${i.href ? html`<a href="${i.href}">${i.label}</a>` : i.label}</span>
    <span class="track"><i style="width:${(i.v / max * 100).toFixed(1)}%"></i></span><span class="right">${fmt(i.v)}</span></div>`)}`;
}

/* ---------------- modal: modal({title, body, ok, onOk(values) -> truthy keeps it open}) */
function modal({title, body, ok = "Save", cancel = "Cancel", onOk, danger, wide}) {
  return new Promise(resolve => {
    const m = $("#modal");
    m.innerHTML = html`<div class="dlg ${wide ? "wide" : ""}"><form novalidate><div class="dh">${title}</div>
      <div class="db"><div class="merr hidden"></div>${body}</div>
      <div class="df">${cancel ? html`<button type="button" class="btn flat" data-close>${cancel}</button>` : ""}
      ${ok ? html`<button type="submit" class="btn pri ${danger ? "danger" : ""}">${ok}</button>` : ""}</div></form></div>`.s;
    m.classList.remove("hidden");
    const f = $("form", m), err = $(".merr", m);
    const close = v => { m.classList.add("hidden"); m.innerHTML = ""; document.removeEventListener("keydown", key); resolve(v); };
    const key = e => { if (e.key === "Escape") close(null); };
    document.addEventListener("keydown", key);
    $$("[data-close]", m).forEach(b => b.onclick = () => close(null));
    m.onclick = e => { if (e.target === m) close(null); };
    f.onsubmit = async e => {
      e.preventDefault();
      if (!onOk) return close(true);
      const sb = $("button[type=submit]", f); sb.disabled = true; err.classList.add("hidden");
      try {
        const vals = Object.fromEntries(new FormData(f));
        $$("input[type=checkbox]", f).forEach(c => { if (c.name) vals[c.name] = c.checked; });
        const r = await onOk(vals, f);
        close(r === undefined ? true : r);
      } catch (ex) { err.textContent = ex.message; err.classList.remove("hidden"); sb.disabled = false; }
    };
    const first = $("input:not([type=hidden]):not([type=checkbox]):not([type=radio]),textarea,select", m);
    if (first) first.focus();
  });
}
const confirmDlg = (title, text, ok = "Delete", danger = true) => modal({title, body: html`<p>${text}</p>`, ok, danger});
function typedConfirm(title, text, word, ok = "Delete") {
  return modal({title, ok, danger: true, body: html`<p>${text}</p><div class="f"><label>Type <b>${word}</b> to confirm</label><input type="text" name="w" autocomplete="off"></div>`,
    onOk: v => { if (v.w !== word) throw new Error(`type ${word} to confirm`); return true; }});
}

/* ================================================================= jobs: follow 202 Accepted until done */
const JOBS = [];
let jobTimer = null;
function track(acc, label) {
  JOBS.unshift({id: acc.job, url: acc.status_url, label, state: "queued", t: new Date().toISOString()});
  if (JOBS.length > 30) JOBS.pop();
  toast(`${label}: queued`); jobBadge();
  if (!jobTimer) jobTimer = setInterval(pollJobs, 2000);
}
async function pollJobs() {
  const open = JOBS.filter(j => ["queued", "started"].includes(j.state));
  if (!open.length) { clearInterval(jobTimer); jobTimer = null; return; }
  for (const j of open) {
    try {
      const r = await api(j.url);
      if (r.state !== j.state) {
        j.state = r.state; j.error = r.error;
        if (r.state === "finished") { toast(`${j.label}: done`); softRefresh(); }
        else if (r.state === "failed" || r.state === "unknown") { toast(`${j.label}: failed${r.error ? " — " + r.error : ""}`, "err"); softRefresh(); }
        jobBadge();
      }
    } catch (e) { if (e.status === 404) { j.state = "unknown"; jobBadge(); } }
  }
}
function jobBadge() {
  const n = JOBS.filter(j => ["queued", "started"].includes(j.state)).length, b = $("#jobbadge");
  b.textContent = n; b.classList.toggle("hidden", !n);
  if (!$("#menu").classList.contains("hidden") && $("#menu").dataset.kind === "jobs") showJobsMenu();
}
function showJobsMenu() {
  const m = $("#menu"); m.dataset.kind = "jobs";
  m.innerHTML = html`<div class="mh"><b>Activity</b><div class="small muted">Operations started in this browser</div></div>
    ${JOBS.length ? JOBS.map(j => html`<div class="mi" style="cursor:default"><span>${st(j.state)}</span><div style="flex:1;min-width:0">
      <div>${j.label}</div><div class="small muted">${ago(j.t)}${j.error ? html` · <span style="color:var(--err)">${j.error}</span>` : ""}</div></div></div>`)
      : html`<div class="mi muted" style="cursor:default">No operations yet.</div>`}
    ${role() !== "auditor" ? html`<a class="mi" href="#/jobs" style="border-top:1px solid var(--line2);margin-top:6px">${ico("list")}All jobs</a>` : ""}`.s;

function parseHash() {
  const h = location.hash.slice(1) || "/";
  const [path, qs] = h.split("?");
  return {path: path || "/", q: Object.fromEntries(new URLSearchParams(qs || ""))};
}
function match(pattern, path) {
  const a = pattern.split("/"), b = path.split("/");
  if (a.length !== b.length) return null;
  const p = {};
  for (let i = 0; i < a.length; i++) {
    if (a[i].startsWith(":")) p[a[i].slice(1)] = decodeURIComponent(b[i]);
    else if (a[i] !== b[i]) return null;
  }
  return p;
}
async function route(soft = false) {
  if (!S.me) return;
  const {path, q} = parseHash();
  const views = VIEWS[role()];
  let view = null, params = {};
  for (const [pat, fn] of Object.entries(views)) {
    const m = match(pat, path);
    if (m) { view = fn; params = m; break; }
  }
  // nav highlight: the longest nav entry the path starts with
  let best = "";
  $$("#side a").forEach(a => { const h = a.dataset.nav; if ((path === h || path.startsWith(h === "/" ? "/\u0000" : h + "/")) && h.length > best.length) best = h; });
  if (path === "/") best = "/";
  $$("#side a").forEach(a => a.classList.toggle("on", a.dataset.nav === best));
  document.body.classList.remove("navon");
  const main = $("#main"), seq = ++S.renderSeq;
  ucache.clear();
  if (!soft) { S.holdRefresh = false; main.innerHTML = `<div class="loading"><span class="spin"></span>Loading…</div>`; }
  if (!view) { main.innerHTML = pageHead("Not found").s + note(`There is no page ${path} for the ${role()} role.`).s; return; }
  try {
    const out = await view(params, q);
    if (seq !== S.renderSeq) return;                  // the user moved on meanwhile
    const y = window.scrollY;
    main.innerHTML = out.s ?? out;
    if (soft) window.scrollTo(0, y);
    const t = $(".phead h1", main); document.title = (t ? t.textContent + " – " : "") + "vdc-cluster console";
    if (view.after) view.after(params, q);
  } catch (e) {
    if (seq !== S.renderSeq) return;
    main.innerHTML = pageHead("Something went wrong").s + errorBox(e.message).s + btn("Try again", "reload", {icon: "refresh"}).s;
  }
}

  const [vms] = await Promise.all([api(P.vms() + "?state=true" + (isProv() && tenantF ? "&tenant=" + enc(tenantF) : "")), flavors()]);
  const tenants = isProv() ? await soft(api("/provider/tenants")) : [];
  const running = vms.filter(v => vmState(v) === "running");
  const rateNow = sum(running, v => (flavorOf(v.flavor) || {}).price_per_hour);

/* ---- create a VM (consumer): a form with live cost and the equivalent REST request */
async function vmCreate() {
  S.holdRefresh = true;
  const [me, imgs, fl, net] = await Promise.all([api("/tenant/me"), api("/tenant/images"), flavors(true), soft(api("/tenant/network"))]);
  const nextFree = failed(net) ? "" : (net.allocations.find(a => a.next_free) || {}).ip || "";
  const q = me.quota, u = me.usage;
  const blocked = f => {
    const why = [];
    if (u.vms + 1 > q.max_vms) why.push("VM quota");
    if (u.vcpus + f.vcpus > q.max_vcpus) why.push("vCPU quota");
    if (u.mem_mb + f.mem_mb > q.max_mem_mb) why.push("RAM quota");
    if (u.disk_gb + f.disk_gb > q.max_disk_gb) why.push("disk quota");
    return why.join(", ");
  };
  S.create = {me, imgs, fl};
  const firstOk = fl.find(f => !blocked(f));
  const img0 = imgs.find(i => i.name === "cirros") || imgs[0];
  return html`${pageHead("Create an instance", "", html`<a href="#/vms">VM instances</a> › create`)}
  ${firstOk ? "" : note(html`<b>The quota of ${me.name} is used up</b> (${u.vms}/${q.max_vms} VMs, ${u.vcpus}/${q.max_vcpus} vCPUs, ${mem(u.mem_mb)}/${mem(q.max_mem_mb)} RAM).
    Delete a VM you no longer need, or ask the provider for a larger quota. Stopped VMs still count.`, "warn")}
  <div class="cols"><form id="vmform" autocomplete="off"><div class="card">
    <div class="f"><label>Name</label><input type="text" name="name" placeholder="e.g. web1" data-change="vmform">
      <div class="hint">Lowercase letters, digits and dashes, starting with a letter, at most 16 characters. Names are unique in the whole cluster.</div></div>
    <div class="f"><span class="flabel">Machine type</span><div class="opts">${fl.map(f => { const why = blocked(f); return html`
      <label class="opt ${why ? "dis" : ""}"><input type="radio" name="flavor" value="${f.name}" ${f === firstOk ? "checked" : ""} ${why ? "disabled" : ""} data-change="vmform">
      <b>${f.name}</b><span class="small">${f.vcpus} vCPU · ${mem(f.mem_mb)} · ${f.disk_gb} GB</span>
      <div class="small muted nowrap">${rate(f.price_per_hour)} / hour</div><div class="small muted nowrap">≈ ${money(f.price_per_hour * HOURS_PER_MONTH)} / month</div>${why ? html`<div class="why">exceeds ${why}</div>` : ""}</label>`; })}</div></div>
    <div class="f"><span class="flabel">Boot image</span><div class="opts">${imgs.map(i => html`
      <label class="opt"><input type="radio" name="image" value="${i.name}" ${i === img0 ? "checked" : ""} data-change="vmform">
      <b>${i.name}</b><span class="small">${i.type} · login <code>${i.user}</code></span><div class="small muted">needs ≥ ${mem(i.mem_mb)} RAM · disk ${i.disk}</div></label>`)}</div></div>
    <details><summary class="flabel" style="cursor:pointer;display:inline">Networking (optional)</summary>
      <div class="f" style="margin-top:10px"><label>Internal IP</label><input type="text" name="ip" placeholder="${nextFree ? "automatic: " + nextFree : "automatic"}" data-change="vmform">
      <div class="hint">Leave empty: the hub gives the next free address of ${me.subnet}. Gateway ${me.gateway}.</div></div></details>
    <div class="merr hidden" id="vmerr" style="color:var(--err);background:var(--err-l);padding:8px 12px;border-radius:4px;margin:12px 0"></div>
    <div style="display:flex;gap:8px;margin-top:16px"><button class="btn pri" type="submit" ${firstOk ? "" : "disabled"}>Create</button><a class="btn flat" href="#/vms">Cancel</a></div>
  </div></form>
  <div class="sticky"><div class="card"><h2>Monthly estimate</h2><div class="stat" id="est">—</div>
    <div class="muted small" id="esth"></div>
    <p class="small muted">If it runs all month (730 h). Metering counts running time only.</p></div>
    <div class="card"><h2>Quota after this VM</h2><div id="qafter"></div></div>
    <div class="card"><details class="eq"><summary>Equivalent REST request</summary><pre class="code" id="eqrest"></pre></details></div></div></div>`;
}
vmCreate.after = () => { $("#vmform").addEventListener("input", vmFormUpdate); vmFormUpdate();
  $("#vmform").onsubmit = async e => {
    e.preventDefault();
    const b = vmBody(), err = $("#vmerr"), sb = $("button[type=submit]", e.target);
    if (!/^[a-z][a-z0-9-]{0,15}$/.test(b.name || "")) { err.textContent = "Give the VM a valid name."; err.classList.remove("hidden"); return; }

    try { const acc = await api("/tenant/vms", {method: "POST", body: b}); track(acc, `Create ${b.name}`); S.holdRefresh = false; location.hash = "#/vms"; }
    catch (ex) { err.textContent = ex.message; err.classList.remove("hidden"); sb.disabled = false; }
  };
};
ACT.vmform = () => vmFormUpdate();
function vmBody() {

function vmFormUpdate() {

}

  return table([{h: "State", f: j => st(j.state)}, {h: "Operation", f: j => html`<a href="#" data-act="job-show" data-id="${j.id}">${j.kind}</a>`},
    {h: "Target", f: j => j.target}, isProv() && {h: "Tenant", f: j => j.tenant || "—"}, {h: "By", f: j => j.username},
    {h: "Started", f: j => html`<span title="${dt(j.created)}">${ago(j.created)}</span>`},
    {h: "Took", f: j => j.ended ? `${Math.max(0, Math.round((T(j.ended) - T(j.created)) / 1000))} s` : "—"},
    {h: "Error", f: j => j.error ? html`<span style="color:var(--err)" class="small">${j.error}</span>` : ""}].filter(Boolean), jobs, {empty: "No operations yet."});
}
async function jobsPage() {

      return api("/provider/users", {method: "POST", body: b}); }})) { toast("Account created"); route(true); }

// The API keeps only password hashes and has no "change password" call, so a reset deletes the
// account and creates it again with the same name, role, tenant and admin flag. VMs and keys
// belong to the tenant (VMs record their owner by name), so nothing else changes.
ACT["user-reset"] = async d => {
  const u = (await api("/provider/users")).find(x => x.username === d.name);
  if (!u) throw new Error(`no account ${d.name}`);
  const pw = await modal({title: `Reset the password of ${u.username}`, ok: "Reset", danger: true, body: html`
    <p>${u.role}${u.tenant ? ` in ${u.tenant}` : ""}${u.tenant_admin ? ", tenant admin" : ""}. The account is deleted and created again with
      the same name, role and tenant, and the new password. The tenant's VMs, keys and network stay as they are.</p>
    <div class="f"><label>New password</label><input type="text" name="password" value="${genPw()}" minlength="8" required>
      <div class="hint">At least 8 characters. It is shown once more after the reset; hand it over yourself.</div></div>
    ${note("A login the user already has keeps working until it expires (8 hours).", "warn")}`,
    onOk: async v => {
      if ((v.password || "").length < 8) throw new Error("the password needs at least 8 characters");
      await api(`/provider/users/${enc(u.username)}`, {method: "DELETE"});
      const b = {username: u.username, password: v.password, role: u.role, tenant_admin: !!u.tenant_admin};
      if (u.tenant) b.tenant = u.tenant;
      try { await api("/provider/users", {method: "POST", body: b}); }
      catch (e) { throw new Error(`The old account was deleted but creating it again failed (${e.message}). ` +
        `Create ${u.username} again under Accounts: role ${u.role}${u.tenant ? ", tenant " + u.tenant : ""}${u.tenant_admin ? ", tenant admin" : ""}.`); }
      return v.password;
    }});
  if (!pw) return;
  await modal({title: `New password for ${u.username}`, ok: "", cancel: "Close", body: html`${note("Shown only now. The API keeps a hash, not the password.")}
    ${kv([["Console", copyLine(location.origin + "/")], ["Username", copyLine(u.username)], ["Password", copyLine(pw)]])}`});
  route(true);
};
ACT["user-del"] = async d => {

async function runRate(tenant) {      // cost per hour of the VMs running now (provider and consumer know the prices)

    ${tcard("", tenantFilter(tenants, q.tenant, "k8s-tenant"), table(cols, cs, {empty: isCons() ? "No clusters yet." : "No clusters."}))}
    ${await addonJobsCard(K8, q.tenant)}`;
}
ACT["k8s-tenant"] = (d, el) => { location.hash = "#/k8s" + (el.value ? "?tenant=" + enc(el.value) : ""); };

      <div><label class="flabel">Ingress</label><label class="small" style="display:flex;gap:6px;align-items:center;height:36px"><input type="checkbox" name="ingress"> Traefik</label></div></div>
    <div class="hint">One extra address per LoadBalancer Service (${me.usage.ips ?? 0} of ${me.quota.max_ips ?? "?"} extra addresses in use). Traefik takes one of them.</div>`,

};
ACT["k8s-delete"] = async d => {
  if (!await typedConfirm(`Delete cluster ${d.name}?`, "Its VMs are deleted, and its addresses, campus ports and floating IPs given back. Everything running in it is lost.", d.name)) return;

  if (parseHash().path.startsWith("/k8s/")) location.hash = "#/k8s"; else route(true);
};
async function clusterDetail({name}, q) {

  const ready = c.status === "ready" || c.status === "scaling";
  const svcs = ready ? await soft(api(`${K8}/clusters/${enc(name)}/services${tq(c.tenant)}`)) : [];
  const d = {name, tenant: c.tenant};
  return html`${pageHead(c.name, html`<span style="margin-right:8px">${st(c.status)}</span>
      ${isCons() ? btn("Scale", "k8s-scale", {icon: "tune", cls: "flat", data: {...d, workers: c.workers}, disabled: c.status !== "ready"}) : ""}
      ${role() !== "auditor" ? btn("Sync exposure", "k8s-sync", {icon: "refresh", cls: "flat", data: d, disabled: !ready}) : ""}
      ${role() !== "auditor" ? btn("Delete", "k8s-delete", {icon: "del", cls: "flat danger", data: d, disabled: c.status === "deleting"}) : ""}`,
      html`<a href="#/k8s">Kubernetes clusters</a> › details`)}
    ${c.error ? note(html`<b>Error:</b> ${c.error}`, "err") : ""}${c.live_error ? note(html`Kubernetes did not answer: ${c.live_error}`, "warn") : ""}
    <div class="cols"><div>
      <div class="card"><h2>Details</h2>${kv([["Tenant", c.tenant], ["k3s", c.version || "—"], ["Workers", c.workers], ["Machine type", c.flavor], ["Image", c.image],
        ["LoadBalancer addresses", html`<span class="mono">${c.lb_ips.join(", ") || "none"}</span>`], ["API server", c.api_fip ? html`floating IP <span class="mono">${c.api_fip}</span>` : "through the jump host"],
        ["Ingress (Traefik)", c.ingress ? "yes" : "no"], ["Created", `${dt(c.created)} (${ago(c.created)})`]])}</div>
      <div class="card p0"><div class="ch"><h2>Nodes</h2></div>${table([{h: "VM", f: n => isCons() || isProv() ? html`<a href="#/vms/${enc(n.name)}">${n.name}</a>` : n.name},
        {h: "Role", f: n => n.role === "server" ? "control plane" : "worker"}, {h: "Address", f: n => html`<span class="mono">${n.ip || "—"}</span>`},
        {h: "Setup", f: n => st(n.status)}, {h: "Kubernetes", f: n => n.k8s ? st(n.k8s.status) : html`<span class="muted">—</span>`}], c.nodes)}</div>
      ${isCons() && ready ? html`<div class="card"><h2>kubectl</h2>
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px">${btn("Kubeconfig (tunnel)", "k8s-kubeconfig", {icon: "download", cls: "sm", data: {...d, access: "tunnel"}})}
          ${btn("Kubeconfig (inside)", "k8s-kubeconfig", {icon: "download", cls: "sm flat", data: {...d, access: "internal"}})}
          ${c.api_fip ? btn("Kubeconfig (floating IP)", "k8s-kubeconfig", {icon: "download", cls: "sm flat", data: {...d, access: "floating"}}) : ""}</div>
        <form id="kform"><div class="f"><label>Run here</label><input type="text" name="args" value="get pods -A -o wide" style="font-family:var(--mono)">
          <div class="hint">kubectl's arguments, without "kubectl". Campus exposure is synced after each command.</div></div>
          <details><summary class="flabel" style="cursor:pointer;display:inline">Manifest for <code>-f -</code></summary>
            <div class="f" style="margin-top:8px"><textarea name="stdin" style="min-height:160px" placeholder="apiVersion: apps/v1&#10;kind: Deployment&#10;..."></textarea></div></details>
          <button class="btn pri sm" type="submit" style="margin-top:8px">${ico("terminal")}Run</button></form>
        <pre class="code hidden" id="kout" style="margin-top:12px"></pre></div>` : ""}
    </div><div>
      <div class="card p0"><div class="ch"><h2>Reachable from campus</h2></div>
        ${table([{h: "Service", f: e => `${e.namespace}/${e.service}`}, {h: "How", f: e => e.mode === "floating" ? "floating IP" : `port ${e.port}/${e.protocol}`},
          {h: "Address", f: e => e.connect ? copyLine(e.connect) : html`<span class="small" style="color:var(--err)">${e.error}</span>`}], c.exposures,
          {empty: html`None. Annotate a LoadBalancer Service with <code>vdc/expose: port</code> or <code>floating</code>, then sync.`})}</div>
      <div class="card p0"><div class="ch"><h2>Services</h2></div>${failed(svcs) ? errorBox(svcs.__error) : table([{h: "Service", f: s => `${s.namespace}/${s.name}`},
        {h: "Type", f: s => s.type}, {h: "Address", f: s => html`<span class="mono small">${s.lb_ip || s.cluster_ip || "—"}</span>`},
        {h: "Ports", f: s => s.ports.map(p => p.port + (p.node_port ? `:${p.node_port}` : "")).join(", ")}, {h: "Expose", f: s => s.expose ? pill(s.expose, "blue") : ""}], svcs, {empty: ready ? "No Services." : "Not ready yet."})}</div>
    </div></div>`;
}
clusterDetail.after = ({name}) => {
  const f = $("#kform"); if (!f) return;
  f.onsubmit = async e => {
    e.preventDefault();
    const v = Object.fromEntries(new FormData(f)), out = $("#kout"), sb = $("button[type=submit]", f);
    sb.disabled = true; out.classList.remove("hidden"); out.textContent = "running…";
    try {
      const r = await api(`${K8}/clusters/${enc(name)}/kubectl`, {method: "POST", body: {args: v.args, stdin: v.stdin && v.stdin.trim() ? v.stdin : undefined}});
      out.textContent = `$ kubectl ${v.args}\n${r.output}${r.exit_code ? `\n(exit code ${r.exit_code})` : ""}${(r.sync || []).length ? "\n\n# campus exposure\n" + r.sync.join("\n") : ""}`;
      if ((r.sync || []).length) setTimeout(() => route(true), 1500);
    } catch (ex) { out.textContent = ex.message; }
    sb.disabled = false;
  };
};
ACT["k8s-kubeconfig"] = async d => {

    <div style="display:flex;gap:8px;margin:12px 0">${btn("Download", "dl", {icon: "download", cls: "sm", data: {text: k.kubeconfig, file: `${d.name}.kubeconfig`}})}
      ${btn("Copy", "copy", {icon: "copy", cls: "sm flat", data: {text: k.kubeconfig}})}</div>
    <div class="small muted">Then: <code>KUBECONFIG=${d.name}.kubeconfig kubectl get nodes</code>. It is the cluster's admin account: keep it private.</div>`});
};
ACT["k8s-scale"] = async d => {
  const cfg = await api(`${K8}/config`);

    <div class="hint">New workers are VMs that join the cluster; removed ones are drained first, the highest-numbered first.</div></div>`,

/* ---------------------------------------------------------------- the edge: floating IPs, campus ports, extra addresses */
async function edgeTargets() {        // what a port or floating IP can point at: VMs, and extra addresses
  const [vms, ips] = await Promise.all([api("/tenant/vms"), api("/tenant/ips")]);
  return [...vms.filter(v => v.status === "active").map(v => ({v: v.name, l: `${v.name} (${v.ip || "?"})`})),
          ...ips.map(i => ({v: i.ip, l: `${i.ip} (extra${i.note ? ": " + i.note : ""})`}))];
}
const targetSelect = (ts, cur, optional) => html`<select name="target">${optional ? html`<option value="">— not now —</option>` : ""}
  ${ts.map(t => html`<option value="${t.v}" ${t.v === cur ? "selected" : ""}>${t.l}</option>`)}</select>`;
async function edgePage() {
  if (role() === "auditor") {
    const pool = await api("/carrier/floating-ips");
    return html`${pageHead("Edge addresses", "", "Carrier")}${note("The floating IP pool of the main PC's campus side (FLOATING_POOL), and what each address carries.")}
      ${tcard("", "", table([{h: "Floating IP", f: f => html`<span class="mono">${f.ip}</span>`}, {h: "Tenant", f: f => f.tenant || html`<span class="muted">free</span>`},
        {h: "Attached to", f: f => f.target ? `${f.target} (${f.address})` : "—"}], pool, {empty: "The pool is empty (FLOATING_POOL in cluster.conf)."}))}`;
  }
  const P0 = isProv() ? "/provider" : "/tenant";
  const [fips, ports, ips, me] = await Promise.all([api(`${P0}/floating-ips`), api(`${P0}/ports`), api(`${P0}/ips`), isCons() ? api("/tenant/me") : null]);
  const u = me && me.usage, qq = me && me.quota;
  const T_ = !isCons() ? [{h: "Tenant", f: x => x.tenant || html`<span class="muted">free</span>`}] : [];
  return html`${pageHead(isCons() ? "External access" : "Edge addresses", btn("Refresh", "refresh", {icon: "refresh", cls: "flat"}), isCons() ? "Networking" : "Infrastructure")}
    ${isCons() ? html`<div class="grid"><div class="card"><h2>In use</h2>${quotaBar("Floating IPs", u.floating_ips, qq.max_floating_ips)}${quotaBar("Campus ports", u.ports, qq.max_ports)}
      ${quotaBar("Extra addresses", u.ips, qq.max_ips)}<div class="small muted">Set by the provider.</div></div>
      <div class="card"><h2>How they differ</h2><p class="small"><b>Floating IP</b>: a campus address of a VM's own, every port, and its own traffic leaves from it.
        <b>Campus port</b>: one port of the lab PC's address forwarded to one port of a VM. <b>Extra address</b>: an address of my subnet that no VM gets by itself,
        for a service address (Kubernetes LoadBalancer) or a second address inside a VM; ports and floating IPs can point at it.</p></div></div>` : ""}
    <div class="card p0"><div class="ch"><h2>Floating IPs</h2>${isCons() ? btn("Book a floating IP", "fip-new", {icon: "add", cls: "flat sm", disabled: u.floating_ips >= qq.max_floating_ips}) : ""}</div>
      ${table([{h: "Floating IP", f: f => copyLine(f.ip)}, ...T_, {h: "Attached to", f: f => f.target ? html`<b>${f.target}</b> <span class="muted mono small">${f.address || ""}</span>` : html`<span class="muted">not attached</span>`},
        {h: "", cls: "act", f: f => f.tenant ? html`${isCons() ? ibtn("hub", "fip-assoc", "Attach", {ip: f.ip, target: f.target || ""}) : ""}
          ${ibtn("close", "fip-dissoc", "Detach", {ip: f.ip}, !f.target)}${ibtn("del", "fip-release", "Give back", {ip: f.ip})}` : ""}],
        fips, {empty: "None. A floating IP needs FLOATING_POOL on the provider's side."})}</div>
    <div class="card p0"><div class="ch"><h2>Campus ports</h2>${isCons() ? btn("Open a port", "port-new", {icon: "add", cls: "flat sm", disabled: u.ports >= qq.max_ports}) : ""}</div>
      ${table([{h: "Connect to", f: p => copyLine(p.connect)}, {h: "Protocol", f: p => p.protocol}, ...T_, {h: "Goes to", f: p => html`<b>${p.target}</b>:${p.port} <span class="muted mono small">${p.address || ""}</span>`},

    <div class="card p0"><div class="ch"><h2>Extra addresses</h2>${isCons() ? btn("Reserve an address", "ip-new", {icon: "add", cls: "flat sm", disabled: u.ips >= qq.max_ips}) : ""}</div>
      ${table([{h: "Address", f: i => html`<span class="mono">${i.ip}</span>`}, ...T_, {h: "Note", f: i => i.note || "—"}, {h: "Floating IP", f: i => i.floating_ip || "—"},
        {h: "Campus ports", f: i => i.ports.join(", ") || "—"}, {h: "", cls: "act", f: i => ibtn("del", "ip-del", "Release", {ip: i.ip})}], ips, {empty: "None."})}</div>`;
}
const edgeSide = () => isProv() ? "/provider" : "/tenant";
ACT["fip-new"] = async () => {
  const ts = await edgeTargets();
  const r = await modal({title: "Book a floating IP", ok: "Book", body: html`<div class="f"><label>Attach to</label>${targetSelect(ts, "", true)}
    <div class="hint">Every port of it is reachable from campus at the floating IP, and its own connections leave from it.</div></div>`,
    onOk: v => api("/tenant/floating-ips", {method: "POST", body: v.target ? {target: v.target} : {}})});
  if (r && r.ip) { toast(`Floating IP ${r.ip}${r.target ? " → " + r.target : ""}`); route(true); }
};
ACT["fip-assoc"] = async d => {
  const ts = await edgeTargets();
  if (await modal({title: `Attach ${d.ip}`, ok: "Attach", body: html`<div class="f"><label>To</label>${targetSelect(ts, d.target)}</div>`,
    onOk: v => api(`/tenant/floating-ips/${enc(d.ip)}/associate`, {method: "POST", body: {target: v.target}})})) { toast(`${d.ip} attached`); route(true); }

ACT["fip-dissoc"] = async d => { await api(`${edgeSide()}/floating-ips/${enc(d.ip)}/disassociate`, {method: "POST"}); toast(`${d.ip} detached`); route(true); };
ACT["fip-release"] = async d => {

ACT["port-new"] = async () => {

    <div class="f row"><div><label class="flabel">Port</label><input class="inp" type="number" name="port" min="1" max="65535" placeholder="e.g. 80"></div>

};
ACT["port-del"] = async d => {
  if (!await confirmDlg(`Close campus port ${d.port}?`, "Connections to it stop.", "Close")) return;
  await api(`${edgeSide()}/ports/${enc(d.port)}`, {method: "DELETE"}); toast(`Port ${d.port} closed`); route(true);

ACT["ip-new"] = async () => {
  const r = await modal({title: "Reserve an extra address", ok: "Reserve", body: html`
    <div class="f"><label>Address</label><input type="text" name="ip" placeholder="automatic: the next free one"></div>
    <div class="f"><label>Note</label><input type="text" name="note" placeholder="e.g. metallb (one word)"></div>`,

ACT["ip-del"] = async d => {
