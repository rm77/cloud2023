apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-multi-metric-demo
  namespace: default
  labels:
    app: hpa-multi-metric-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hpa-multi-metric-demo
  template:
    metadata:
      labels:
        app: hpa-multi-metric-demo
    spec:
      containers:
        - name: app
          image: hpa-multi-metric-demo:v1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: hpa-multi-metric-demo
  namespace: default
  labels:
    app: hpa-multi-metric-demo
spec:
  selector:
    app: hpa-multi-metric-demo
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: hpa-multi-metric-demo
  namespace: default
  labels:
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: hpa-multi-metric-demo
  endpoints:
    - port: http
      path: /metrics
      interval: 5s
      scrapeTimeout: 4s
