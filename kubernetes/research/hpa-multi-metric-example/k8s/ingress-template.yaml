apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hpa-multi-metric-demo
  namespace: __NAMESPACE__
spec:
  ingressClassName: nginx
  rules:
    - host: hpa-multi-metric-demo.__HOST_IP__.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hpa-multi-metric-demo
                port:
                  number: 80
