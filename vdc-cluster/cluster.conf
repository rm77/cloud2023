# vdc-cluster settings.
# Sourced by cluster.sh / image/build.sh on the lab PC, and baked into every
# image as /etc/lab/cluster.env (so hub and spokes agree on the addressing).

# ---- images
ALPINE_VERSION=3.24.1
DISK_SIZE=20G                   # hub + spoke disks (sparse); holds tenant base images + guest disks
CIRROS_URL=https://download.cirros-cloud.net/0.6.2/cirros-0.6.2-x86_64-disk.img
ROOT_PASSWORD=vdclab            # serial-console login only; SSH is key-only

# ---- underlay (lab PC bridge = the physical switch)
# Address plan (static, the default):
#   hub            10.20.0.2
#   PC <ID>        10.20.<ID>.1          (main PC = ID 1 = 10.20.1.1)
#   spoke hv<ID><NN> 10.20.<ID>.<100+NN>  e.g. hv203 = 10.20.2.103
#   10.20.0.3-99   free for bare-metal spokes (IP= in /etc/lab/join.conf)
# Check "ip route" on the lab PCs: if 10.20.x is used on campus, pick another /16.
UNDERLAY_BR=br-under
UNDERLAY_NET=10.20.0.0
UNDERLAY_PREFIX=16
UNDERLAY_MTU=1600
LABPC_IP=10.20.1.1              # this PC on br-under (host.conf overrides it per PC)
HUB_IP=10.20.0.2

# IP_MODE=static  spokes get the address chosen by cluster.sh (SMBIOS lab.ip) or IP= in
#                 join.conf; the hub runs DNS only, no DHCP server on the underlay.
# IP_MODE=dhcp    opt-in: the hub runs DHCP (pool below, lease pinned on join).
# Baked into the images: rebuild both after changing it.
IP_MODE=static
DHCP_START=10.20.0.100
DHCP_END=10.20.0.250

# ---- interfaces inside the VMs
HUB_UPLINK_IF=eth0              # QEMU user-net -> internet (hub NATs the underlay out here)
HUB_UNDERLAY_IF=eth1
SPOKE_UNDERLAY_IF=eth0

# ---- overlay / control plane
TENANT_MTU=1500
API_PORT=8080                   # hub join/state API + image server
POLL=10                         # spoke agent poll interval (s); NotReady after 3 misses
HUB_SCHEDULABLE=yes             # hub also runs tenant guests

# ---- tenant guests
# Each tenant has a subnet (hubctl tenant add NAME VNI [SUBNET]; VNI 1-254 defaults to
# 192.168.<VNI>.0/24). The hub allocates every guest's address from it (.10 upward;
# .1 = gateway on the hub, .2-.9 reserved) and hands it over in a cloud-init seed ISO.
GUEST_PASSWORD=vdclab           # console/SSH password of the image's default user (ubuntu, cirros, ...)
GUEST_HOST_RESERVE=512          # MB of a node's RAM never given to guests (scheduler)

# ---- access to tenant guests
# The hub is every tenant's router: .1 of each subnet sits on its br-t<VNI>, guests get it as
# gateway and DNS. Tenants are kept apart there (no tenant-to-tenant or tenant-to-underlay
# traffic); the main lab PC (LABPC_IP) may reach all guests, for staff.
TENANT_INTERNET=on              # default for new tenants: guests reach the internet (NAT via the hub)
JUMP_PORT=45222                 # SSH jump host: ssh -J t-<tenant>@<lab PC>:45222 user@guest
EDGE=yes                        # main PC forwards JUMP_PORT from EDGE_IF to the hub (cluster.sh edge)
EDGE_IF=                        # campus-side NIC of the main PC; empty = the one with the default route
WEBCONSOLE_PORTS=45300-45399    # ttyd web consoles on the hub (reached only through the cloud API)
WEBCONSOLE_MINUTES=60           # a web console closes after this, or when its browser tab closes

# ---- VM sizes (lab PC)
HUB_MEM=2048
HUB_CPUS=2
SPOKE_MEM=2048
SPOKE_CPUS=2
CLONE=linked                    # linked = qcow2 overlay on images/spoke.qcow2, full = copy
JOIN_TIMEOUT=300                # cluster.sh stops following a boot/join after this (s)

# ---- command journal: every provisioning tool call (qemu, ip, virsh, mkfs, apk, ...)
# logged per tool: lab PC logs/commands/, VMs /var/log/lab/commands/, builds logs/build/
TRACE=changes                   # changes | all (also read-only calls) | off
TRACE_OUTPUT=no                 # yes = also log each command's output

# ---- multi-PC: every PC has its own host.conf (./cluster.sh host init ID [NIC]);
# without it the PC is host 1, the main PC (runs the hub), with no uplink NIC.
#   HOST_ID    1..254, unique per PC    -> spoke names hv<ID><NN>, MACs 52:54:00:21:<ID>:<NN>
#   HOST_ROLE  main (runs the hub) | worker
#   LABPC_IP   this PC on br-under       (10.20.<ID>.1)
#   UPLINK_NIC NIC or VLAN (enp1s0.20) bridged into br-under, shared by all PCs

# ---- cloud API (./cluster.sh cloud install|start; main PC only; code in cloud/, data in state/cloud/)
CLOUD_PORT=36100                # http://<LABPC_IP>:36100/docs
CLOUD_BIND=0.0.0.0              # 127.0.0.1 = only from this PC
CLOUD_ADMIN_USER=admin          # first provider account; password generated into state/cloud/admin-password
CLOUD_QUEUE=redis               # job queue: redis (private instance on a socket in state/cloud/) | sqlite
CLOUD_TUNNELS=yes               # Cloudflare quick tunnels to guests (https://<random>.trycloudflare.com)
CLOUD_TUNNEL_HOURS=8            # a tunnel closes after this
CLOUD_TUNNELS_PER_TENANT=2      # default limit for new tenants (the provider can change it per tenant)
CLOUD_TUNNEL_PROTOCOL=auto      # cloudflared to Cloudflare: auto | http2 (TCP 443 only) | quic
CLOUD_VNI_MIN=100               # onboarding pool: a tenant without a given VNI gets the next free one,
CLOUD_VNI_MAX=254               #   and the subnet CLOUD_SUBNET_TEMPLATE with {vni} filled in
CLOUD_SUBNET_TEMPLATE='10.{vni}.20.0/24'
CLOUD_METER_MINUTES=5           # usage sampling interval
